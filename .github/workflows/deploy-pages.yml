name: Deploy static web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'petakumpet62/petakumpet62.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Validate public backend URL
        run: |
          if [ -z "$EXPO_PUBLIC_SOCKET_URL" ]; then
            echo "Set the EXPO_PUBLIC_SOCKET_URL Actions variable to the public HTTPS backend URL." >&2
            exit 1
          fi
          if ! node -e '
            const value = process.env.EXPO_PUBLIC_SOCKET_URL;
            if (
              !URL.canParse(value) ||
              new URL(value).protocol !== "https:" ||
              !new URL(value).hostname
            ) process.exit(1);
          '; then
            echo "EXPO_PUBLIC_SOCKET_URL must be a valid public HTTPS URL." >&2
            exit 1
          fi
        env:
          EXPO_PUBLIC_SOCKET_URL: ${{ vars.EXPO_PUBLIC_SOCKET_URL }}

      - name: Build core Expo web app
        run: npx expo export --platform web --output-dir dist
        working-directory: mobile
        env:
          EXPO_PUBLIC_SOCKET_URL: ${{ vars.EXPO_PUBLIC_SOCKET_URL }}

      - name: Preserve Expo static assets on GitHub Pages
        run: touch mobile/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify PETAK push subscribers about deployment
        env:
          BACKEND_URL: ${{ vars.EXPO_PUBLIC_SOCKET_URL }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PETAK_PUSH_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$PUSH_ADMIN_TOKEN" ]; then
            echo "::warning::Set PETAK_PUSH_ADMIN_TOKEN to enable deployment push notifications."
            exit 0
          fi
          node --input-type=module <<'NODE'
          const backendUrl = process.env.BACKEND_URL.replace(/\/+$/, '');
          const response = await fetch(`${backendUrl}/api/admin/push/deployment`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.PUSH_ADMIN_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              deploymentId: `${process.env.GITHUB_REPOSITORY}:${process.env.GITHUB_SHA}`,
              version: process.env.GITHUB_SHA.slice(0, 7),
            }),
          });
          if (!response.ok) {
            throw new Error(`Backend rejected the deployment push (${response.status}).`);
          }
          const result = await response.json();
          console.log(`Deployment notification completed; ${result.delivered} device(s) reached.`);
          NODE

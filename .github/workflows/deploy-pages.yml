name: Deploy static web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static web app
        run: |
          mkdir -p _site/assets/pwa _site/assets/avatars _site/mobile/assets
          cp index.html app.js style.css manifest.webmanifest service-worker.js _site/
          cp -R assets/pwa/. _site/assets/pwa/
          cp assets/avatars/seeker.webp assets/avatars/hider.webp assets/avatars/impostor.webp _site/assets/avatars/
          cp mobile/assets/logo-splash.png _site/mobile/assets/logo-splash.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

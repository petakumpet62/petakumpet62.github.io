    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch((error) => {
            console.error('Gagal mengaktifkan dukungan offline PETAK', error);
          });
        }, { once: true });
